[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# How long Cloudflare, which sits in front of Netlify, keeps a response at its edge.
# Cloudflare reads Cloudflare-CDN-Cache-Control, uses it instead of Cache-Control, and strips it before
# the response reaches the visitor, so browsers are unaffected.
#
# Pages: 5 minutes. This only takes effect because a Cloudflare Cache Rule makes paths ending in "/"
# eligible for cache with "Use cache-control header if present" (the free plan cannot set a fixed edge TTL
# under 2 hours). After a deploy, a page can therefore be up to 5 minutes old.
#
# stale-if-error: if Netlify answers with a 5xx error, Cloudflare keeps serving the copy it already has for
# up to 7 days instead of showing the error. It only helps for pages Cloudflare has cached, and it is ignored
# if "Always Online" is switched on in Cloudflare.
# This catch-all comes first; the more specific rules below set their own, longer value.
[[headers]]
  for = "/*"
  [headers.values]
    Cloudflare-CDN-Cache-Control = "max-age=300, stale-if-error=604800"

# Hashed assets (JS, CSS, images processed by Astro) — cache forever, no revalidation
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cloudflare-CDN-Cache-Control = "max-age=31536000"

# Legacy /assets/* path — same immutable rule
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Public folder images (not hashed) — cache for 1 week, no must-revalidate.
# List these by exact path: a pattern like "/*.png" also matches the hashed images under /_astro/
# and would cut their one-year cache down to a week. Add a rule here for each new file in public/.
[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Cloudflare-CDN-Cache-Control = "max-age=604800"

# HTML — short cache, revalidate is fine here since content can change
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Old URLs from the previous site design
[[redirects]]
  from = "/science"
  to = "/research/"
  status = 301

[[redirects]]
  from = "/story"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/symbol"
  to = "/about/#symbol"
  status = 301

[[redirects]]
  from = "/who-its-for"
  to = "/#spaces"
  status = 301

[[redirects]]
  from = "/partners"
  to = "/waitlist/"
  status = 301
