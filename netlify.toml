[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Hashed assets (JS, CSS, images processed by Astro) — cache forever, no revalidation
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Legacy /assets/* path — same immutable rule
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Public folder images (not hashed) — cache for 1 week, no must-revalidate.
# List these by exact path: a pattern like "/*.png" also matches the hashed images under /_astro/
# and would cut their one-year cache down to a week. Add a rule here for each new file in public/.
[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML — short cache, revalidate is fine here since content can change
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Old URLs from the previous site design
[[redirects]]
  from = "/science"
  to = "/research/"
  status = 301

[[redirects]]
  from = "/story"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/symbol"
  to = "/about/#symbol"
  status = 301

[[redirects]]
  from = "/who-its-for"
  to = "/#spaces"
  status = 301

[[redirects]]
  from = "/partners"
  to = "/waitlist/"
  status = 301
